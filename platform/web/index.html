<style>
/* --- Design tokens — GitHub Primer dark --- */
:root {
  --canvas: #0d1117; --canvas-subtle: #161b22; --canvas-inset: #010409; --overlay: #161b22;
  --border: #30363d; --border-muted: #21262d;
  --fg: #e6edf3; --fg-muted: #8b949e; --fg-subtle: #6e7681;
  --accent: #4493f8; --accent-emph: #1f6feb; --accent-subtle: rgba(56,139,253,0.15);
  --success: #3fb950; --success-emph: #238636; --success-hover: #2ea043; --success-subtle: rgba(46,160,67,0.15); --success-border: rgba(46,160,67,0.4);
  --danger: #f85149; --danger-emph: #da3633; --danger-subtle: rgba(248,81,73,0.1); --danger-border: rgba(248,81,73,0.4);
  --attention: #d29922; --attention-subtle: rgba(187,128,9,0.15); --attention-border: rgba(187,128,9,0.4);
  --neutral-muted: rgba(110,118,129,0.4);
  --btn-bg: #21262d; --btn-hover: #30363d; --btn-border: rgba(240,246,252,0.1);
  --tab-underline: #f78166;
  --thumb: #30363d; --thumb-hover: #484f58;
  --shadow-lg: 0 8px 24px rgba(1,4,9,.75);
  --radius: 8px;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); color: var(--fg); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font-family: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
svg.oct { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; display: inline-block; vertical-align: -3px; }
:focus-visible { outline: 2px solid var(--accent-emph); outline-offset: 1px; border-radius: 6px; }
.mono { font-family: var(--mono); }
.muted { color: var(--fg-muted); }
.small { font-size: 12px; }
.spacer { flex: 1; }

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--thumb-hover); border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-button { display: none; height: 0; width: 0; }
@-moz-document url-prefix() { * { scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; } }

/* --- Primitives: buttons, labels, kbd, boxes --- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--fg); font: 500 14px/1 var(--sans); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, color .12s; text-decoration: none !important; }
.btn:hover { background: var(--btn-hover); border-color: #8b949e; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--success-emph); color: #fff; border-color: rgba(240,246,252,.1); }
.btn-primary:hover { background: var(--success-hover); border-color: rgba(240,246,252,.1); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-emph); border-color: var(--danger-emph); color: #fff; }
.btn-danger-solid { background: var(--danger-emph); color: #fff; border-color: rgba(240,246,252,.1); }
.btn-danger-solid:hover { background: #b62324; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-muted); }
.btn-ghost:hover { background: var(--btn-hover); border-color: transparent; color: var(--fg); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.icon-btn { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--fg-muted); cursor: pointer; transition: background .12s, color .12s; }
.icon-btn:hover { background: var(--btn-hover); color: var(--fg); }
.icon-btn.bordered { border: 1px solid var(--border); width: 32px; height: 32px; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.label { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; font: 500 12px/1 var(--sans); border: 1px solid var(--border); border-radius: 2em; color: var(--fg-muted); white-space: nowrap; }
.label svg.oct { width: 13px; height: 13px; vertical-align: 0; }
.diff { font-weight: 600; }
.diff.easy { color: var(--success); }
.diff.medium { color: var(--attention); }
.diff.hard { color: var(--danger); }
.label.diff.easy { background: var(--success-subtle); border-color: transparent; }
.label.diff.medium { background: var(--attention-subtle); border-color: transparent; }
.label.diff.hard { background: var(--danger-subtle); border-color: transparent; }
.label.solved { color: var(--success); border-color: var(--success-border); }
.label.attempted { color: var(--attention); border-color: var(--attention-border); }
kbd { display: inline-block; font: 500 10.5px/16px var(--mono); padding: 0 5px; border: 1px solid var(--border); border-bottom-color: var(--border-muted); border-radius: 5px; background: var(--canvas-subtle); box-shadow: inset 0 -1px 0 var(--border-muted); color: var(--fg); vertical-align: 1px; }

.Box { border: 1px solid var(--border); border-radius: var(--radius); background: var(--canvas); margin: 16px 0; overflow: hidden; }
.Box-header { background: var(--canvas-subtle); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.Box-header .right { margin-left: auto; font-weight: 400; color: var(--fg-muted); font-size: 12px; }
.Box-row { padding: 12px 16px; border-top: 1px solid var(--border-muted); display: flex; align-items: center; gap: 12px; color: var(--fg); }
.Box-row:first-child { border-top: 0; }
a.Box-row:hover { background: var(--canvas-subtle); text-decoration: none; }
.Box-row .grow { flex: 1; min-width: 0; }

.st { display: inline-flex; color: var(--fg-subtle); }
.st.attempted { color: var(--attention); }
.st.passed { color: var(--success); }

.bar { height: 6px; background: var(--neutral-muted); border-radius: 6px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--success-emph); border-radius: 6px; transition: width .4s ease; }

/* --- App shell: header + sidebar --- */
header { background: var(--canvas-inset); border-bottom: 1px solid var(--border); height: 52px; padding: 0 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; flex-shrink: 0; position: relative; z-index: 20; }
.hdr-left, .hdr-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hdr-right { justify-content: flex-end; }
.hdr-center { display: flex; align-items: center; gap: 8px; }
.brand { color: var(--fg); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; margin-right: 4px; }
.brand:hover { text-decoration: none; opacity: .85; }
.go-mark { display: inline-flex; align-items: center; justify-content: center; height: 24px; padding: 0 7px; border-radius: 6px; background: #00add8; color: #fff; font: italic 700 14px/1 var(--sans); letter-spacing: -.02em; }
.hdr-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.hdr-crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 500; font-size: 14px; min-width: 0; }
.hdr-crumb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-progress { display: inline-flex; align-items: center; gap: 8px; color: var(--fg-muted); font-size: 12px; }
.hdr-progress .bar { width: 120px; }

.layout { flex: 1; display: flex; min-height: 0; position: relative; }
#sidebar { width: 280px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 8px 40px; background: var(--canvas); transition: margin-left .2s ease, transform .2s ease; }
/* docked on every page; the toggle remembers its state separately for reading and exercise pages */
body.sb-collapsed #sidebar { margin-left: -281px; }
body.sb-instant #sidebar { transition: none; }
.scrim { position: absolute; inset: 0; background: rgba(1,4,9,.5); z-index: 25; opacity: 0; pointer-events: none; transition: opacity .2s; }
body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
.mod-title { width: 100%; display: flex; align-items: center; gap: 6px; padding: 10px 8px 6px; font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-muted); background: none; border: 0; cursor: pointer; text-align: left; border-radius: 6px; }
.mod-title:hover { color: var(--fg); }
.mod-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mod-title .chev { transition: transform .15s; }
.mod-title.collapsed .chev { transform: rotate(-90deg); }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); font-size: 14px; position: relative; }
.nav-item:hover { background: var(--btn-hover); text-decoration: none; }
.nav-item.active { background: var(--btn-bg); font-weight: 600; }
.nav-item.active::before { content: ""; position: absolute; left: -8px; top: 5px; bottom: 5px; width: 4px; border-radius: 6px; background: var(--accent-emph); }
.nav-item .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .counter { font-size: 11px; color: var(--fg-muted); background: var(--neutral-muted); border-radius: 2em; padding: 0 7px; line-height: 18px; font-weight: 500; }
.nav-sub .nav-item { padding-left: 30px; font-size: 13px; }

#main { flex: 1; overflow-y: auto; min-width: 0; }
body:not(.ws-mode) #main { scrollbar-gutter: stable; } /* no sideways jump when a page starts scrolling */
body.ws-mode #main { overflow: hidden; background: var(--canvas-inset); }
.content { max-width: 1012px; margin: 0 auto; padding: 32px 32px 80px; }
.page-title { font-size: 28px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; margin: 0 0 6px; }
.page-sub { color: var(--fg-muted); margin: 0 0 24px; }

/* --- Home / lesson / settings --- */
.stats { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: center; padding: 20px 24px; }
.ring { position: relative; width: 132px; height: 132px; margin: 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .ring-label b { font-size: 26px; font-weight: 600; line-height: 1.1; }
.ring .ring-label span { font-size: 12px; color: var(--fg-muted); }
.diff-rows { display: grid; gap: 14px; }
.diff-row { display: grid; grid-template-columns: 70px 1fr 64px; align-items: center; gap: 12px; font-size: 13px; }
.diff-row .bar { height: 8px; }
.diff-row.easy .bar > span { background: var(--success); }
.diff-row.medium .bar > span { background: var(--attention); }
.diff-row.hard .bar > span { background: var(--danger); }
.diff-row .n { text-align: right; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.continue { display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
.continue .grow { flex: 1; min-width: 0; }
.continue .eyebrow { font-size: 12px; color: var(--fg-muted); }
.continue .title { font-weight: 600; font-size: 15px; }

.ptable { width: 100%; border-collapse: collapse; }
.ptable th { text-align: left; font: 500 12px var(--sans); color: var(--fg-muted); padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--canvas-subtle); }
.ptable td { padding: 11px 16px; border-bottom: 1px solid var(--border-muted); }
.ptable tr:last-child td { border-bottom: 0; }
.ptable tbody tr { cursor: pointer; transition: background .1s; }
.ptable tbody tr:hover { background: var(--canvas-subtle); }
.ptable tbody tr:nth-child(2n) { background: rgba(22,27,34,.45); }
.ptable tbody tr:nth-child(2n):hover { background: var(--canvas-subtle); }
.ptable .c-status { width: 56px; }
.ptable .c-diff { width: 110px; }
.lesson-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 8px; }
.lesson-head .grow { flex: 1; min-width: 0; }
.lesson-progress { min-width: 180px; text-align: right; }
.lesson-progress .bar { margin-top: 6px; }
.section-title { font-size: 16px; font-weight: 600; margin: 32px 0 12px; display: flex; align-items: center; gap: 8px; }

.setting-row { padding: 16px; border-top: 1px solid var(--border-muted); display: flex; align-items: center; gap: 16px; }
.setting-row:first-of-type { border-top: 0; }
.setting-row .grow { flex: 1; }
.setting-row .desc { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
/* settings */
/* one centred column; ~880px keeps each label close to its control on the right */
.settings { max-width: 880px; margin: 0 auto; }
.s-section { margin-bottom: 20px; }
.s-section .Box { margin: 0; }
.s-section .Box-header svg.oct { color: var(--fg-muted); vertical-align: 0; }
.s-section .Box-header.danger-head { color: var(--danger); border-bottom-color: var(--danger-border); background: var(--danger-subtle); }
.s-section .Box-header.danger-head svg.oct { color: var(--danger); }
.Box-body { padding: 16px; }
.s-section .Box-body.stat-grid { border-bottom: 1px solid var(--border-muted); }
.s-section .Box-header + .setting-row, .s-section .Box-body + .setting-row { border-top: 0; }
.preview { border-top: 1px solid var(--border-muted); padding: 14px 16px 16px; background: var(--canvas-inset); }
.preview-cap { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--fg-muted); margin-bottom: 10px; }
.preview pre { background: var(--canvas) !important; transition: font-size .15s; }
.kbd-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .kbd-grid, .stat-grid { grid-template-columns: 1fr; } }
.kbd-card { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--canvas-subtle); }
.kbd-card .keys { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.kbd-card .keys kbd { font-size: 12px; line-height: 22px; padding: 0 8px; }
.kbd-card .plus { color: var(--fg-subtle); font-size: 12px; margin: 0 2px; }
.kbd-card .t { font-weight: 600; font-size: 14px; }
.kbd-card .d { color: var(--fg-muted); font-size: 12px; margin-top: 2px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--canvas-subtle); }
.stat b { display: block; font-size: 26px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--fg-muted); }.data-ic { width: 32px; height: 32px; border-radius: 8px; background: var(--btn-bg); display: inline-flex; align-items: center; justify-content: center; color: var(--fg-muted); flex-shrink: 0; }
.data-ic svg.oct { vertical-align: 0; }
.path-pill { font: 12px var(--mono); color: var(--fg-muted); background: var(--canvas-subtle); border: 1px solid var(--border-muted); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
.switch { width: 36px; height: 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--btn-bg); position: relative; cursor: pointer; padding: 0; transition: background .15s, border-color .15s; flex-shrink: 0; }
.switch span { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg-muted); transition: transform .15s, background .15s; }
.switch[aria-checked="true"] { background: var(--success-emph); border-color: var(--success-emph); }
.switch[aria-checked="true"] span { transform: translateX(16px); background: #fff; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.stepper button { width: 32px; height: 30px; border: 0; background: var(--btn-bg); cursor: pointer; font-size: 16px; }
.stepper button:hover { background: var(--btn-hover); }
.stepper span { width: 44px; text-align: center; font: 500 13px var(--mono); }

/* --- Markdown (GitHub markdown-body) --- */
.markdown-body { font-size: 15px; line-height: 1.6; word-wrap: break-word; }
.markdown-body > :first-child { margin-top: 0 !important; }
.markdown-body.hide-h1 > h1:first-child { display: none; }
.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { margin: 28px 0 14px; font-weight: 600; line-height: 1.25; }
.markdown-body h1 { font-size: 1.9em; padding-bottom: .3em; border-bottom: 1px solid var(--border-muted); }
.markdown-body h2 { font-size: 1.4em; padding-bottom: .3em; border-bottom: 1px solid var(--border-muted); }
.markdown-body h3 { font-size: 1.15em; }
.markdown-body p, .markdown-body ul, .markdown-body ol, .markdown-body table, .markdown-body pre, .markdown-body blockquote { margin: 0 0 16px; }
.markdown-body ul, .markdown-body ol { padding-left: 1.6em; }
.markdown-body li + li { margin-top: .3em; }
.markdown-body code { font-family: var(--mono); font-size: 85%; padding: .15em .4em; background: var(--neutral-muted); border-radius: 5px; white-space: break-spaces; }
.markdown-body pre { background: var(--canvas-subtle); border: 1px solid var(--border-muted); border-radius: var(--radius); padding: 14px 16px; overflow: auto; font-size: 85%; line-height: 1.5; position: relative; }
.markdown-body pre code, .markdown-body pre code.hljs { background: transparent; padding: 0; font-size: 100%; white-space: pre; border-radius: 0; }
.markdown-body table { border-collapse: collapse; display: block; width: max-content; max-width: 100%; overflow: auto; font-size: 14px; }
.markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 7px 13px; }
.markdown-body th { font-weight: 600; background: var(--canvas-subtle); text-align: left; }
.markdown-body tr:nth-child(2n) td { background: rgba(22,27,34,.6); }
.markdown-body blockquote { padding: 10px 16px; color: var(--fg); border-left: 3px solid var(--accent-emph); background: var(--accent-subtle); border-radius: 0 6px 6px 0; }
.markdown-body blockquote > :last-child { margin-bottom: 0; }
.markdown-body hr { height: 1px; padding: 0; margin: 24px 0; background: var(--border); border: 0; }
.markdown-body strong { font-weight: 600; }
.hljs { background: transparent !important; }
.code-wrap { position: relative; }
.copy-btn { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity .15s; background: var(--btn-bg); border: 1px solid var(--border); }
.code-wrap:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }

/* --- Workspace (exercise page) — LeetCode-style panels --- */
.ws { height: 100%; padding: 8px; display: grid; grid-template-columns: var(--left, 44%) 8px minmax(0, 1fr); min-height: 0; }
.ws-col { display: grid; grid-template-rows: minmax(0, 1fr) 8px var(--console, 34%); min-height: 0; min-width: 0; }
.panel { background: var(--canvas); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 6px; background: var(--canvas-subtle); border-bottom: 1px solid var(--border-muted); flex-shrink: 0; user-select: none; }
.ptab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-muted); font: 500 13px var(--sans); cursor: pointer; white-space: nowrap; transition: color .12s, background .12s; }
.ptab:hover { color: var(--fg); background: var(--btn-hover); }
.ptab.active { color: var(--fg); }
.ptab.active svg.oct { color: var(--tab-underline); }
.ptab .count { font-size: 11px; color: var(--fg-muted); background: var(--neutral-muted); border-radius: 2em; padding: 0 6px; line-height: 16px; }

.panel-head .tools { margin-left: auto; display: flex; align-items: center; gap: 2px; }

.panel-foot { display: flex; align-items: center; gap: 12px; height: 30px; padding: 0 12px; border-top: 1px solid var(--border-muted); background: var(--canvas-subtle); font-size: 12px; color: var(--fg-muted); flex-shrink: 0; }
.gutter-v { cursor: col-resize; display: flex; align-items: center; justify-content: center; }
.gutter-h { cursor: row-resize; display: flex; align-items: center; justify-content: center; }
.gutter-v::after { content: ""; width: 2px; height: 32px; border-radius: 2px; background: var(--border); transition: background .12s, height .12s; }
.gutter-h::after { content: ""; height: 2px; width: 32px; border-radius: 2px; background: var(--border); transition: background .12s, width .12s; }
.gutter-v:hover::after, .gutter-v.dragging::after { background: var(--accent-emph); height: 100%; }

.ws.max-code .gutter-h, .ws.max-code #result-panel { display: none; }
.ws.max-result .gutter-h, .ws.max-result #code-panel { display: none; }

.acc-head .ic { color: var(--attention); display: inline-flex; }
.acc-item.locked .acc-head .ic { color: var(--fg-subtle); }
.acc-head .hint-note { margin-left: auto; font-size: 12px; color: var(--fg-muted); font-weight: 400; display: inline-flex; align-items: center; gap: 6px; }
.acc-head .chev { transition: transform .15s; color: var(--fg-muted); }
.acc-item.open .acc-head .chev { transform: rotate(180deg); }
.acc-body { display: none; padding: 2px 14px 14px 40px; }
.acc-item.open .acc-body { display: block; animation: fadeIn .18s ease; }
.acc-body .markdown-body { font-size: 14px; }
.acc-body .markdown-body p:last-child { margin-bottom: 0; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }

.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 48px 24px; color: var(--fg-muted); }
.empty .big { width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--canvas-subtle); border: 1px solid var(--border); color: var(--fg-muted); }

.empty p { margin: 0; max-width: 360px; font-size: 13px; }
.file-cap { display: flex; align-items: center; gap: 6px; font: 500 12px var(--mono); color: var(--fg-muted); margin: 0 0 8px; }
.info-note { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; margin-bottom: 16px; border-radius: 6px; background: var(--accent-subtle); color: var(--fg); font-size: 13px; }
.info-note svg.oct { color: var(--accent); margin-top: 2px; }

.lang-pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; font: 500 12px var(--sans); color: var(--fg-muted); background: var(--btn-bg); }

.save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; }

.ptab .dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-muted); display: none; }

.verdict .v-title { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.verdict.ok .v-title { color: var(--success); }
.verdict.bad .v-title { color: var(--danger); }
.verdict.warn .v-title { color: var(--attention); }

.success-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius); background: var(--success-subtle); border: 1px solid var(--success-border); margin-bottom: 16px; }

.success-card .ic svg.oct { vertical-align: 0; }
.success-card .grow { flex: 1; min-width: 0; }
.success-card .t { font-weight: 600; }
.success-card .s { font-size: 12px; color: var(--fg-muted); }
.cases { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

.case.fail .dotc { background: var(--danger); }
.kv { margin: 0 0 12px; }
.kv .k { font-size: 12px; font-weight: 500; color: var(--fg-muted); margin-bottom: 6px; }
.kv .v { font: 13px/1.55 var(--mono); background: var(--canvas-subtle); border: 1px solid var(--border-muted); border-radius: var(--radius); padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }

.kv .v.want { border-color: var(--success-border); }
.kv .v.empty-val { color: var(--fg-subtle); font-style: italic; }
.check-label { font-size: 12px; color: var(--fg-muted); margin: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
.check-label::after { content: ""; flex: 1; height: 1px; background: var(--border-muted); }
.berrs { border: 1px solid var(--danger-border); border-radius: var(--radius); overflow: hidden; background: var(--danger-subtle); }
.berr { display: flex; gap: 12px; align-items: baseline; padding: 9px 12px; cursor: pointer; font: 13px/1.5 var(--mono); border-top: 1px solid var(--danger-border); transition: background .1s; }
.berr:first-child { border-top: 0; }
.berr:hover { background: rgba(248,81,73,.16); }
.berr .loc { color: var(--accent); white-space: nowrap; }
.berr .msg { color: var(--fg); }
.hint-line { font-size: 12px; color: var(--fg-muted); margin: 0 0 10px; }
.raw-cmd { font: 12px var(--mono); color: var(--fg-muted); padding: 10px 14px; border-bottom: 1px solid var(--border-muted); white-space: nowrap; overflow-x: auto; }

.raw pre { margin: 0; padding: 12px 14px; font: 12px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word; }
.l-pass { color: var(--success); } .l-fail { color: var(--danger); } .l-dim { color: var(--fg-subtle); }
.running { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--fg-muted); }

.modal { width: 100%; max-width: 440px; background: var(--overlay); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 0; font-weight: 600; font-size: 16px; }
.modal-head .ic { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--btn-bg); flex-shrink: 0; }

.modal-body { padding: 10px 16px 16px 58px; color: var(--fg-muted); font-size: 14px; }
.modal-body input { width: 100%; margin-top: 12px; height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--canvas); font: 14px var(--mono); }
.modal-body input:focus { outline: none; border-color: var(--accent-emph); box-shadow: 0 0 0 3px var(--accent-subtle); }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border-muted); background: var(--canvas); }
#toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 110; pointer-events: none; }
.toast { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 8px; background: var(--overlay); border: 1px solid var(--border); box-shadow: var(--shadow-lg); font-size: 13px; animation: toastIn .18s ease; pointer-events: auto; }
.toast.ok svg.oct { color: var(--success); } .toast.err svg.oct { color: var(--danger); } .toast.info svg.oct { color: var(--accent); }

@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* --- Responsive --- */
@media (max-width: 1100px) {
  body.ws-mode #main { overflow-y: auto; }
  .ws { display: flex; flex-direction: column; height: auto; gap: 8px; }
  .ws-col { display: flex; flex-direction: column; gap: 8px; }
  .gutter-v, .gutter-h { display: none !important; }
  .ws > .panel { max-height: none; }
  #code-panel { height: 520px; }
  #result-panel { min-height: 260px; }
  .panel-body { overflow: visible; }
  .tools [data-max] { display: none; }
}
@media (max-width: 860px) {
  #sidebar { position: absolute; top: 0; bottom: 0; left: 0; z-index: 30; transform: translateX(-100%); margin-left: 0 !important; }
  body.drawer-open #sidebar { transform: none; box-shadow: var(--shadow-lg); }
  .hdr-progress, .brand-text { display: none; }
  .content { padding: 20px 16px 60px; }
  .stats { grid-template-columns: 1fr; }
  .hide-sm { display: none !important; }
}

// Browser-only conveniences in one versioned object; code and progress live in workspace/.
const PREFS_KEY = 'learngo.prefs';
const PREFS_VERSION = 1;
const PREFS_DEFAULTS = {
  version: PREFS_VERSION,
  editor: { fontSize: 14, ligatures: true },
  layout: {
    sidebar: { reading: 'open', exercise: 'collapsed' },
    collapsedModules: [],
    workspace: { leftPanel: null, consoleHeight: null, consoleCollapsed: false }, // null = default size
  },
  session: { lastExercise: null },
};
const prefs = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));
  // merge keeps the defaults' shape: unknown keys are dropped, missing ones filled in
  const merge = (def, val) => {
    if (def === null || typeof def !== 'object' || Array.isArray(def)) return val === undefined ? def : val;
    const out = {};
    for (const k of Object.keys(def)) out[k] = merge(def[k], val == null ? undefined : val[k]);
    return out;
  };
  // migrateLegacy converts the old flat "learngo.<key>" strings (pre-v1) and deletes them.
  const migrateLegacy = () => {
    let ls; try { ls = localStorage; } catch { return {}; }
    const g = k => ls.getItem('learngo.' + k);
    const num = s => s == null || s === '' || isNaN(+s) ? undefined : +s;
    const flag = (s, yes) => s == null ? undefined : s === yes;
    let mods; try { mods = JSON.parse(g('collapsedModules')); } catch { }
    const old = {
      editor: { fontSize: num(g('fontSize')), ligatures: g('ligatures') == null ? undefined : g('ligatures') !== '0' },
      layout: {
        sidebar: {
          reading: g('sidebarCollapsed') == null ? undefined : g('sidebarCollapsed') === '1' ? 'collapsed' : 'open',
          exercise: g('sidebarCollapsedWs') == null ? undefined : g('sidebarCollapsedWs') === '0' ? 'open' : 'collapsed',
        },
        collapsedModules: Array.isArray(mods) ? mods : undefined,
        workspace: { leftPanel: num(g('splitLeft')), consoleHeight: num(g('consoleHeight')), consoleCollapsed: flag(g('consoleMin'), '1') },
      },
      session: { lastExercise: g('lastExercise') || undefined },
    };
    for (let i = ls.length - 1; i >= 0; i--) {
      const k = ls.key(i);
      if (k && k.startsWith('learngo.') && k !== PREFS_KEY) ls.removeItem(k);
    }
    return old;
  };
  let data;
  try { data = JSON.parse(localStorage.getItem(PREFS_KEY)); } catch { }
  data = merge(clone(PREFS_DEFAULTS), data || migrateLegacy());
  data.version = PREFS_VERSION;
  const save = () => { try { localStorage.setItem(PREFS_KEY, JSON.stringify(data)); } catch { /* storage blocked: keep in memory */ } };
  save();

    const keys = path.split('.'), last = keys.pop();
    let o = data;
    for (const k of keys) { if (o[k] == null) { if (!create) return [undefined, last]; o[k] = {}; } o = o[k]; }
    return [o, last];
  };
  return {
    get(path) { const [o, k] = parent(path, false); return o === undefined ? undefined : o[k]; },
    set(path, value) { const [o, k] = parent(path, true); o[k] = value; save(); },
    reset(path) { const def = path.split('.').reduce((o, k) => o?.[k], PREFS_DEFAULTS); this.set(path, def === undefined ? undefined : clone(def)); },
  };
})();

async function api(path, method = 'GET', body) {
  const opts = { method };
  if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers = { 'Content-Type': 'application/json' }; }
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
  return r.json();
}

marked.use({ gfm: true });
// highlight.js's Go grammar predates Go 1.18/1.21; add the newer built-ins and types.
(() => {
  const go = hljs.getLanguage('go');
  if (!go || !go.keywords) return;
  const add = (cls, words) => {
    const cur = go.keywords[cls];
    go.keywords[cls] = Array.isArray(cur) ? [...cur, ...words] : (cur ? cur + ' ' : '') + words.join(' ');
  };
  add('built_in', ['min', 'max', 'clear']);
  add('type', ['any', 'comparable']);
})();
// bash marks words like `test`/`env` in `go test` as shell built-ins; for our
// command snippets, colour only the command at the start of a line and comments.
hljs.registerLanguage('sh', () => ({
  name: 'Shell', aliases: ['shell', 'bash', 'console'],
  contains: [hljs.HASH_COMMENT_MODE, hljs.QUOTE_STRING_MODE, { className: 'built_in', begin: /^\s*(?:\$\s+)?[A-Za-z][\w.-]*/m }],
}));
function md(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'markdown-body ' + cls;
  div.innerHTML = marked.parse(text || '');
  div.querySelectorAll('pre code').forEach(el => {
    if (!/language-/.test(el.className)) el.classList.add('language-plaintext');
    hljs.highlightElement(el);
  });
  return div;
}
function codeBlock(code, lang = 'go') {
  const wrap = document.createElement('div');
  wrap.className = 'code-wrap';
  const m = md('```' + lang + '\n' + code.replace(/\n$/, '') + '\n```');
  wrap.appendChild(m);
  const b = document.createElement('button');
  b.className = 'icon-btn copy-btn'; b.title = 'Copy'; b.innerHTML = icon('copy');
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(code); b.innerHTML = icon('check'); toast('Copied to clipboard', 'ok'); setTimeout(() => b.innerHTML = icon('copy'), 1400); }
    catch { toast('Copy failed', 'err'); }
  };
  wrap.appendChild(b);
  return wrap;
}

// --- toasts & modals ---
function toast(msg, kind = 'info', ms = 2200) {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = icon(kind === 'ok' ? 'checkCircle' : kind === 'err' ? 'xCircle' : 'info') + `<span>${esc(msg)}</span>`;
  $('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 220); }, ms);
}
// modal resolves true when confirmed; typeToConfirm requires typing that word first.
function modal({ title, body, confirm = 'Confirm', cancel = 'Cancel', danger = false, typeToConfirm = '' }) {
  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><span class="ic ${danger ? 'danger' : ''}">${icon(danger ? 'alert' : 'info')}</span>${esc(title)}</div>
      <div class="modal-body">${body}${typeToConfirm ? `<div style="margin-top:12px">Type <b class="mono" style="color:var(--fg)">${esc(typeToConfirm)}</b> to confirm.</div><input id="m-input" autocomplete="off" spellcheck="false">` : ''}</div>
      <div class="modal-foot"><button class="btn" id="m-cancel">${esc(cancel)}</button><button class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" id="m-ok">${esc(confirm)}</button></div></div>`;
    document.body.appendChild(scrim);
    const ok = scrim.querySelector('#m-ok'), input = scrim.querySelector('#m-input');
    const done = v => { scrim.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } if (e.key === 'Enter' && !ok.disabled) { e.preventDefault(); done(true); } };
    if (input) { ok.disabled = true; input.oninput = () => ok.disabled = input.value !== typeToConfirm; setTimeout(() => input.focus(), 0); } else setTimeout(() => ok.focus(), 0);
    scrim.addEventListener('mousedown', e => { if (e.target === scrim) done(false); });
    scrim.querySelector('#m-cancel').onclick = () => done(false);
    ok.onclick = () => done(true);
    document.addEventListener('keydown', onKey, true);
  });
}

    if (collapsed) continue;
    m.lessons.forEach((l, li) => {
      const lex = l.exercises || [];
      const passed = lex.filter(e => e.status === 'passed').length;
      const complete = lex.length && passed === lex.length;
      const active = route === '/lesson/' + l.id;
      const open = active || route.startsWith('/exercise/' + l.id + '/');
      html += `<a class="nav-item ${active ? 'active' : ''}" href="/lesson/${enc(l.id)}" title="${esc(l.title)}">
        <span class="st ${complete ? 'passed' : ''}">${icon(complete ? 'checkCircle' : 'book')}</span>
        <span class="grow">${li + 1}. ${esc(l.short || l.title)}</span><span class="counter">${passed}/${lex.length}</span></a>`;
      if (open) html += '<div class="nav-sub">' + lex.map((e, ei) =>
        `<a class="nav-item ${route === '/exercise/' + e.id ? 'active' : ''}" href="/exercise/${enc(e.id)}" title="${esc(e.title)}">${statusIcon(e.status)}<span class="grow">${ei + 1}. ${esc(e.title)}</span></a>`).join('') + '</div>';
    });
  }
  $side.innerHTML = html;
  $side.querySelectorAll('.mod-title').forEach(b => b.onclick = () => {
    const set = new Set(prefs.get('layout.collapsedModules'));
    set.has(b.dataset.mod) ? set.delete(b.dataset.mod) : set.add(b.dataset.mod);
    prefs.set('layout.collapsedModules', [...set]);
    renderShell();
  });
}

function ringSVG(pct) {
  const r = 58, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--neutral-muted)" stroke-width="8"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--success)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}" style="transition:stroke-dashoffset .6s ease"/></svg>`;
}
function viewHome() {
  const exs = allExercises();
  const done = exs.filter(e => e.status === 'passed').length;
  const by = d => { const xs = exs.filter(e => e.difficulty === d); return [xs.filter(e => e.status === 'passed').length, xs.length]; };
  const last = exs.find(e => e.id === prefs.get('session.lastExercise'));
  const target = last && last.status !== 'passed' ? last : exs.find(e => e.status !== 'passed');
  let html = `<h1 class="page-title">Welcome back</h1><p class="page-sub">Pick up where you left off, or jump into any module.</p>`;
  if (target) {

    html += `<div class="Box"><div class="continue">${statusIcon(target.status)}

  html += `<div class="Box"><div class="stats">

      <div class="diff-rows">${['easy', 'medium', 'hard'].map(d => { const [a, b] = by(d); return `<div class="diff-row ${d}"><span class="diff ${d}">${cap(d)}</span><div class="bar"><span style="width:${b ? 100 * a / b : 0}%"></span></div><span class="n">${a} / ${b}</span></div>`; }).join('')}</div>

// Monaco's Go grammar colours all identifiers alike; add function and built-in
// type tokens so the editor matches the highlighted code in the description.
let goPatched = false;
async function patchGoTokens(monaco) {
  if (goPatched) return;
  goPatched = true;
  const go = monaco.languages.getLanguages().find(l => l.id === 'go');
  if (!go || !go.loader) return;
  const { language } = await go.loader();
  const lang = { ...language, tokenizer: { ...language.tokenizer } };
  lang.goTypes = ['bool', 'byte', 'complex64', 'complex128', 'error', 'float32', 'float64', 'int', 'int8', 'int16', 'int32', 'int64',
    'rune', 'string', 'uint', 'uint8', 'uint16', 'uint32', 'uint64', 'uintptr', 'any', 'comparable'];
  lang.tokenizer.root = [
    [/[a-zA-Z_]\w*(?=\s*\()/, { cases: { '@goTypes': 'type', '@keywords': 'keyword', '@default': 'function' } }],
    [/[a-zA-Z_]\w*/, { cases: { '@goTypes': 'type', '@keywords': 'keyword', '@default': 'identifier' } }],
    ...language.tokenizer.root,
  ];
  monaco.languages.setMonarchTokensProvider('go', lang);
}

const isDirty = name => !!(cur && cur.models[name] && cur.models[name].getValue() !== cur.saved[name]);
const anyDirty = () => !!cur && Object.keys(cur.models).some(isDirty);

function setSaveState(state) { // 'saved' | 'dirty' | 'saving' | 'error'
  const el = $('save-state'); if (!el) return;
  const text = { saved: 'Saved', dirty: 'Unsaved changes', saving: 'Saving…', error: 'Save failed' }[state];
  el.innerHTML = `<span class="save-dot ${state === 'saved' ? '' : state === 'saving' ? 'saving' : 'dirty'}"></span>${text}`;
}
function updateDirtyUI() {
  if (!cur) return;
  document.querySelectorAll('#code-tabs .ptab[data-file]').forEach(t => t.classList.toggle('is-dirty', isDirty(t.dataset.file)));
  if (!cur.saving) setSaveState(anyDirty() ? 'dirty' : 'saved');
}

// replaceContent swaps a model's text while keeping undo history and the cursor.
function replaceContent(model, text) {
  if (model.getValue() === text) return;
  const pos = cur.editor && cur.editor.getModel() === model ? cur.editor.getPosition() : null;
  model.pushEditOperations([], [{ range: model.getFullModelRange(), text }], () => null);
  if (pos) cur.editor.setPosition(pos);
}

// format=true runs gofmt (Ctrl+S, before tests); autosave skips it so code doesn't jump while typing.
async function save(format) {
  if (!cur || !cur.editor) return null;
  const mine = cur;
  clearTimeout(mine.autosaveTimer);
  const files = {};
  for (const [name, m] of Object.entries(mine.models)) files[name] = m.getValue();
  mine.saving = true; setSaveState('saving');
  try {
    const { exercise, formatErrors } = await api('/api/save/' + enc(mine.ex.id), 'POST', { files, format });
    if (cur !== mine) return exercise;
    for (const f of exercise.files) {
      if (cur.models[f.name] && cur.models[f.name].getValue() === files[f.name]) {
        cur.saved[f.name] = f.content;
        if (format) replaceContent(cur.models[f.name], f.content);
      }
    }
    if (format) setMarkers('gofmt', parseFormatErrors(formatErrors || {}));
    return exercise;
  } catch (e) {
    setSaveState('error'); toast('Save failed: ' + e.message, 'err', 4000);
    throw e;
  } finally {
    mine.saving = false;
    updateDirtyUI();
  }
}
function scheduleAutosave() {
  if (!cur) return;
  updateDirtyUI();
  clearTimeout(cur.autosaveTimer);
  cur.autosaveTimer = setTimeout(() => save(false).catch(() => {}), 900);
}
async function formatNow() {
  try {
    await save(true);
    const errs = cur && window.monaco ? Object.values(cur.models).flatMap(m => monaco.editor.getModelMarkers({ resource: m.uri, owner: 'gofmt' })) : [];
    toast(errs.length ? 'Saved — fix the syntax error to format' : 'Formatted & saved', errs.length ? 'err' : 'ok');
  } catch { }
}

// closeExercise disposes the editor; unsaved edits are saved first.
function closeExercise() {
  if (!cur) return;
  const old = cur;
  clearTimeout(old.autosaveTimer);
  if (anyDirty()) {
    const files = {};
    for (const [name, m] of Object.entries(old.models)) files[name] = m.getValue();
    fetch('/api/save/' + enc(old.ex.id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ files, format: false }), keepalive: true });
  }
  if (old.editor) old.editor.dispose();
  Object.values(old.models).forEach(m => m.dispose());
  cur = null;
}

// --- diagnostics ---
function parseFormatErrors(errs) {
  const out = [];
  for (const [file, msg] of Object.entries(errs)) for (const line of msg.split('\n')) {
    const m = /^(\d+):(\d+): (.*)$/.exec(line.trim());
    if (m) out.push({ file, line: +m[1], col: +m[2], msg: m[3] });
  }
  return out;
}
function diagnosticsFromResult(r) {
  if (!r || !r.report) return [];
  return (r.report.buildErrors || []).map(e => ({ file: e.file, line: e.line, col: e.col, msg: e.message }));
}
function setMarkers(owner, diags) {
  if (!cur || !window.monaco) return;
  for (const [name, model] of Object.entries(cur.models)) {
    monaco.editor.setModelMarkers(model, owner, diags.filter(d => sameFile(name, d.file)).map(d => ({
      startLineNumber: d.line, startColumn: d.col, endLineNumber: d.line,
      endColumn: model.getLineMaxColumn(Math.min(d.line, model.getLineCount())),
      message: d.msg, severity: monaco.MarkerSeverity.Error,
    })));
  }
}

    <a class="icon-btn" ${ex.next ? `href="/exercise/${enc(ex.next)}"` : 'aria-disabled="true" style="opacity:.35;pointer-events:none"'} title="Next problem">${icon('chevRight')}</a>`;
  $('hdr-center').innerHTML = `<button class="btn btn-primary" id="run" title="Run tests (Ctrl+Enter)">${icon('play')}<span>Run tests</span></button>`;
  $('run').onclick = runTests;
}

function renderWorkspace() {

function applyLayout() {
  const ws = $view;
  const left = prefs.get('layout.workspace.leftPanel'); if (left) ws.style.setProperty('--left', left + '%');
  const ch = prefs.get('layout.workspace.consoleHeight'); if (ch) ws.style.setProperty('--console', ch + 'px');
  ws.classList.toggle('console-min', prefs.get('layout.workspace.consoleCollapsed') && !cur.max);
  ws.classList.remove('max-desc', 'max-code', 'max-result');
  if (cur.max) ws.classList.add('max-' + cur.max);
}
function toggleMax(which) {
  cur.max = cur.max === which ? '' : which;
  applyLayout();
  renderLeftTabs(); renderCodeTabs(); renderBottomTabs();
}
const maxBtn = which => `<button class="icon-btn" data-max="${which}" title="${cur.max === which ? 'Restore' : 'Maximize'}">${icon(cur.max === which ? 'screenNormal' : 'screenFull')}</button>`;
function bindMax(root) { root.querySelectorAll('[data-max]').forEach(b => b.onclick = () => toggleMax(b.dataset.max)); }

function setupGutters() {
  const ws = $view;
  const drag = (el, onMove, onEnd) => el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    el.classList.add('dragging'); document.body.classList.add('resizing');
    const move = ev => onMove(ev);
    const up = () => { el.classList.remove('dragging'); document.body.classList.remove('resizing'); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); onEnd(); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
  });
  let pct = prefs.get('layout.workspace.leftPanel') || 44;
  drag($('gut-v'), ev => {
    const r = ws.getBoundingClientRect();
    pct = Math.min(70, Math.max(24, (ev.clientX - r.left) / r.width * 100));
    ws.style.setProperty('--left', pct + '%');
  }, () => prefs.set('layout.workspace.leftPanel', +pct.toFixed(1)));
  let h = prefs.get('layout.workspace.consoleHeight') || 0;
  drag($('gut-h'), ev => {
    const col = $('gut-h').parentElement.getBoundingClientRect();
    h = Math.min(col.height - 160, Math.max(90, col.bottom - ev.clientY));
    ws.classList.remove('console-min'); prefs.set('layout.workspace.consoleCollapsed', false);
    ws.style.setProperty('--console', h + 'px');
  }, () => h && prefs.set('layout.workspace.consoleHeight', Math.round(h)));
}

function renderLeftTabs() {
  const ex = cur.ex;

  const el = $('left-tabs');

    `<span class="tools">${maxBtn('desc')}</span>`;

function renderLeft() {
  const body = $('left-body');

function renderDescription(pad) {
  const ex = cur.ex;
  const status = ex.status === 'passed' ? `<span class="label solved">${icon('checkCircle')} Solved</span>`
    : ex.status === 'attempted' ? `<span class="label attempted">${icon('dot')} Attempted</span>` : '';

// Hints: LeetCode-style accordion; hint N+1 stays locked until hint N is revealed.
function renderHints(acc) {
  const ex = cur.ex;
  acc.innerHTML = '';
  for (let i = 0; i < ex.hintsTotal; i++) {
    const revealed = i < ex.hints.length, next = i === ex.hints.length;
    const item = document.createElement('div');
    item.className = `acc-item ${revealed ? 'revealed' : next ? 'next' : 'locked'} ${revealed && cur.openHints.has(i) ? 'open' : ''}`;
    const note = revealed ? '' : next ? 'Click to reveal' : `${icon('lock')}Reveal hint ${i} first`;
    item.innerHTML = `<button class="acc-head" ${!revealed && !next ? 'disabled' : ''}>
        <span class="ic">${icon(!revealed && !next ? 'lock' : 'light')}</span>Hint ${i + 1}
        <span class="hint-note">${note}${revealed ? icon('chevDown', 'chev') : ''}</span></button>
      <div class="acc-body"></div>`;
    if (revealed) item.querySelector('.acc-body').appendChild(md(ex.hints[i]));
    item.querySelector('.acc-head').onclick = async () => {
      if (revealed) { cur.openHints.has(i) ? cur.openHints.delete(i) : cur.openHints.add(i); item.classList.toggle('open'); return; }
      if (!next) return;
      try {
        const d = await api('/api/hint/' + enc(ex.id), 'POST');
        cur.ex = { ...d, files: cur.ex.files };
        cur.openHints.add(i);
        renderHints(acc);
      } catch (e) { toast(e.message, 'err'); }
    };
    acc.appendChild(item);
  }
}

function renderSolution(pad) {
  const ex = cur.ex;
  if (ex.solution) {
    if (ex.status === 'passed') pad.insertAdjacentHTML('beforeend', `<div class="info-note">${icon('info')}<span>Different can still be correct. Compare approaches and borrow the idioms you like.</span></div>`);
    for (const [name, code] of Object.entries(ex.solution)) {
      pad.insertAdjacentHTML('beforeend', `<div class="file-cap">${icon('file')}${esc(name)}</div>`);
      pad.appendChild(codeBlock(code));
    }
    return;
  }
  const passed = ex.status === 'passed';
  pad.innerHTML = `<div class="empty"><span class="big">${icon(passed ? 'unlock' : 'lock')}</span>
    <h3>${passed ? 'Solution unlocked' : 'Solution is locked'}</h3>
    <p>${passed ? 'You solved it — compare your code with the reference solution.' : 'It unlocks automatically when all tests pass. Try the hints in the Description tab first.'}</p>
    <div style="margin-top:8px">${passed ? `<button class="btn btn-primary" id="sol-btn">${icon('unlock')} View solution</button>` : `<button class="btn btn-ghost btn-sm" id="sol-btn" style="color:var(--danger)">I give up — show it anyway</button>`}</div></div>`;
  $('sol-btn').onclick = async () => {
    if (!passed && !await modal({ title: 'Show the solution?', body: 'Struggling is where the learning happens — try the hints first. If you continue, this exercise is marked as “solution viewed early”.', confirm: 'Show solution', danger: true })) return;
    try {
      const d = await api('/api/solution/' + enc(ex.id), 'POST');
      cur.ex = { ...d, files: cur.ex.files };

  };
}

function renderTests(pad) {
  pad.innerHTML = `<div class="info-note">${icon('beaker')}<span>These tests decide whether your solution is accepted. Reading them is encouraged — they are the exact specification.</span></div>`;
  for (const t of cur.ex.tests || []) {

async function mountEditor() {
  const mine = cur;

  for (const f of cur.ex.files) {
    const uri = monaco.Uri.parse('file:///' + cur.ex.id + '/' + f.name);

    cur.saved[f.name] = f.content;

  }
  const host = $('editor');
  host.innerHTML = '';
  cur.editor = monaco.editor.create(host, {
    model: cur.models[cur.active] || null, theme: 'monokai', automaticLayout: true,
    fontFamily: '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace', fontLigatures: prefs.get('editor.ligatures'),
    fontSize: prefs.get('editor.fontSize'), lineHeight: 1.6, tabSize: 4, insertSpaces: false, detectIndentation: false,
    wordWrap: 'on', wrappingIndent: 'indent', minimap: { enabled: false }, scrollBeyondLastLine: false,
    renderLineHighlight: 'all', padding: { top: 14, bottom: 14 }, bracketPairColorization: { enabled: true },
    guides: { indentation: true }, smoothScrolling: true, cursorSmoothCaretAnimation: 'on', cursorBlinking: 'smooth',
    fixedOverflowWidgets: true, overviewRulerLanes: 0, hideCursorInOverviewRuler: true, overviewRulerBorder: false,
    scrollbar: { verticalScrollbarSize: 10, horizontalScrollbarSize: 10, useShadows: false, verticalSliderSize: 6, horizontalSliderSize: 6 },
  });
  document.fonts.ready.then(() => window.monaco && monaco.editor.remeasureFonts());
  setMarkers('go', diagnosticsFromResult(cur.result));
  const pos = () => { const p = cur.editor.getPosition(); if (p) $('cursor-pos').textContent = `Ln ${p.lineNumber}, Col ${p.column}`; };
  cur.editor.onDidChangeCursorPosition(pos); pos();
  cur.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, formatNow);
  cur.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runTests);

  };
  cur.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Equal, () => zoom(1));

  cur.editor.focus();
}

const VERDICT = {
  accepted: ['Accepted', 'ok'], wrong_answer: ['Wrong Answer', 'bad'], compile_error: ['Compile Error', 'bad'],
  runtime_error: ['Runtime Error', 'bad'], timeout: ['Time Limit Exceeded', 'warn'],
};
const kv = (k, v, cls = '') => `<div class="kv"><div class="k">${k}</div><div class="v ${cls} ${v === '' ? 'empty-val' : ''}">${v === '' ? '(empty)' : esc(v)}</div></div>`;
function failureHTML(f) {
  if (f.got !== undefined || f.want !== undefined) return (f.input ? kv('Input', f.input) : '') + kv('Output', f.got || '', 'got') + kv('Expected', f.want || '', 'want');
  return kv('Message', f.message);
}
function caseHTML(tc) {
  if (tc.passed) return `<div class="hint-line" style="color:var(--success)">${icon('checkCircle')} This test passed.</div>`;
  let html = '';
  if (tc.panicked) html += `<div class="hint-line" style="color:var(--danger)">The program panicked (crashed) while running this test.</div>`;
  const fs = tc.failures || [];
  fs.forEach((f, i) => { if (fs.length > 1) html += `<div class="check-label">Check ${i + 1} of ${fs.length}</div>`; html += failureHTML(f); });
  if (tc.log && tc.log.trim()) {
    let log = tc.log.trimEnd();
    if (tc.panicked) { const ls = log.split('\n'); log = ls.slice(0, 14).join('\n') + (ls.length > 14 ? '\n…' : ''); }
    html += kv(tc.panicked ? 'Panic' : 'Stdout', log);
  }
  return html || `<div class="hint-line">This test failed without a message — see the Output tab.</div>`;
}
// Compiler errors name files by base name; editor files may be nested (internal/geom/geom.go).
const sameFile = (path, reported) => path === reported || path.endsWith('/' + reported);
function jumpTo(file, line, col) {
  if (!cur || !cur.editor) return;
  file = Object.keys(cur.models).find(name => sameFile(name, file));
  if (!file) return;
  if (cur.active !== file) document.querySelector(`#code-tabs .ptab[data-file="${CSS.escape(file)}"]`)?.click();
  cur.editor.revealLineInCenter(line);
  cur.editor.setPosition({ lineNumber: line, column: col || 1 });
  cur.editor.focus();
}

function renderBottom() {
  const body = $('bottom-body');
  const r = cur.result;
  if (cur.running) { body.innerHTML = `<div class="running"><span class="spinner"></span>Running tests…</div>`; return; }
  if (cur.bottomTab === 'output') {
    if (!r) { body.innerHTML = `<div class="empty"><span class="big">${icon('terminal')}</span><p>Raw <span class="mono">go test</span> output appears here after a run.</p></div>`; return; }
    const lines = esc(r.output).split('\n').map(l =>
      /^\s*(--- PASS|ok\s|PASS$)/.test(l) ? `<span class="l-pass">${l}</span>` :
      /^\s*(--- FAIL|FAIL|panic:)|\.go:\d+:(\d+:)?/.test(l) ? `<span class="l-fail">${l}</span>` :
      /^(=== (RUN|PAUSE|CONT)|#)/.test(l) ? `<span class="l-dim">${l}</span>` : l).join('\n');
    body.innerHTML = `<div class="raw"><div class="raw-cmd">${esc(r.command)}</div><pre>${lines}</pre></div>`;
    return;
  }
  if (!r) {
    body.innerHTML = `<div class="empty"><span class="big">${icon('play')}</span><h3>Run your code to see results</h3><p>Press <b>Run tests</b> or <kbd>Ctrl</kbd> <kbd>Enter</kbd>. Your code is saved automatically.</p></div>`;
    return;
  }
  const rep = r.report;
  if (!rep) { cur.bottomTab = 'output'; renderBottomTabs(); renderBottom(); return; }
  const [title, cls] = VERDICT[rep.verdict] || ['Failed', 'bad'];
  let html = `<div class="panel-pad" style="padding-top:16px"><div class="verdict ${cls}"><span class="v-title">${title}</span>`;
  if (!['compile_error', 'runtime_error'].includes(rep.verdict)) html += `<span class="v-sub">${rep.passed} / ${rep.total} tests passed</span>`;
  html += `<span class="v-sub">Runtime ${esc(r.duration)}</span></div>`;

  if (rep.verdict === 'accepted') {
    const ex = cur.ex;
    html += `<div class="success-card"><span class="ic">${icon('trophy')}</span><div class="grow"><div class="t">Great work — all tests pass!</div>
      <div class="s">The reference solution is now unlocked. Compare approaches, then move on.</div></div>
      <button class="btn btn-sm" id="see-sol">${icon('unlock')} Solution</button>${ex.next ? `<a class="btn btn-primary btn-sm" href="/exercise/${enc(ex.next)}">Next ${icon('chevRight')}</a>` : ''}</div>`;
  } else if (rep.verdict === 'compile_error') {
    const vet = (rep.buildErrors || []).some(e => /Printf|Sprintf|Errorf|format/.test(e.message));
    html += `<p class="hint-line">${vet ? 'The code compiles, but <span class="mono">go vet</span> found bugs. ' : ''}Click an error to jump to that line.</p><div class="berrs">` +
      (rep.buildErrors || []).map(e => `<div class="berr" data-file="${esc(e.file)}" data-line="${e.line}" data-col="${e.col}"><span class="loc">${esc(e.file)}:${e.line}:${e.col}</span><span class="msg">${esc(e.message)}</span></div>`).join('') + `</div>`;
    if (rep.buildOutput) html += `<div style="margin-top:12px">${kv('Details', rep.buildOutput.trimEnd())}</div>`;
  } else if (rep.verdict === 'timeout') {
    html += `<p class="hint-line">Your code ran for more than 2 minutes. Look for a loop that never ends.</p>`;
  }

  const tests = rep.tests || [];
  if (tests.length && rep.verdict !== 'compile_error') {
    if (cur.caseIdx == null || cur.caseIdx >= tests.length) {
      const f = tests.findIndex(t => !t.passed);
      cur.caseIdx = f >= 0 ? f : 0;
    }
    html += `<div class="cases">` + tests.map((t, i) => `<button class="case ${t.passed ? '' : 'fail'} ${i === cur.caseIdx ? 'active' : ''}" data-i="${i}" title="${esc(t.name)}"><span class="dotc"></span>${esc(t.display)}</button>`).join('') + `</div>`;
    html += caseHTML(tests[cur.caseIdx]);
  }
  body.innerHTML = html + '</div>';
  body.querySelectorAll('.case').forEach(b => b.onclick = () => { cur.caseIdx = +b.dataset.i; renderBottom(); });
  body.querySelectorAll('.berr').forEach(b => b.onclick = () => jumpTo(b.dataset.file, +b.dataset.line, +b.dataset.col));
  const see = $('see-sol');
  if (see) see.onclick = () => { cur.leftTab = 'solution'; renderLeftTabs(); renderLeft(); if (cur.max) toggleMax(cur.max); };
}

async function runTests() {
  const run = $('run');
  if (!cur || !run || cur.running) return;
  cur.running = true;
  run.disabled = true; run.innerHTML = `<span class="spinner"></span><span>Running…</span>`;
  cur.bottomTab = 'result';
  if ($view.classList.contains('console-min')) { $view.classList.remove('console-min'); prefs.set('layout.workspace.consoleCollapsed', false); }
  if (cur.max === 'code' || cur.max === 'desc') toggleMax(cur.max);
  renderBottomTabs(); renderBottom();
  const wasSolved = cur.ex.status === 'passed';
  try {
    if (cur.editor) await save(true);
    const { result, exercise } = await api('/api/run/' + enc(cur.ex.id), 'POST');
    if (!cur) return;
    cur.ex = { ...exercise, files: cur.ex.files };
    cur.result = result; cur.caseIdx = null;
    setMarkers('go', diagnosticsFromResult(result));
    await loadCourse();
    if (result.passed && !wasSolved) toast('Accepted! Exercise solved 🎉', 'ok', 3000);
    renderHeaderControls();
    const lb = $('left-body'), top = lb ? lb.scrollTop : 0; // keep the reader's place
    renderLeftTabs(); renderLeft();
    if (lb) lb.scrollTop = top;
  } catch (e) {
    toast(e.message, 'err', 4000);
  } finally {
    if (cur) {
      cur.running = false;
      renderBottomTabs(); renderBottom();
      const b = $('run'); if (b) { b.disabled = false; b.innerHTML = `${icon('play')}<span>Run tests</span>`; }
    }
  }
}

// Pick up edits made outside the platform (e.g. VS Code) when the tab regains focus.
window.addEventListener('focus', async () => {
  if (!cur || !cur.editor) return;
  try {
    const d = await api('/api/exercise/' + enc(cur.ex.id));
    for (const f of d.files) {
      if (!cur.models[f.name] || isDirty(f.name) || f.content === cur.saved[f.name]) continue;
      cur.saved[f.name] = f.content;
      replaceContent(cur.models[f.name], f.content);
      cur.saved[f.name] = f.content;
    }
    clearTimeout(cur.autosaveTimer);
    updateDirtyUI();
  } catch { }
});
window.addEventListener('beforeunload', e => { if (anyDirty()) { e.preventDefault(); e.returnValue = ''; } });

// --- Router — clean URLs via the History API (/settings, /exercise/…) ---
const currentPath = () => decodeURIComponent(location.pathname).replace(/\/+$/, '') || '/';
function navigate(path, replace = false) {
  if (path === location.pathname && !replace) return;
  history[replace ? 'replaceState' : 'pushState'](null, '', path);
  route();
}
// Old bookmarks like /#/exercise/... keep working.
if (location.hash.startsWith('#/')) history.replaceState(null, '', location.hash.slice(1));
// Same-origin links switch pages without a reload; modified clicks (new tab, etc.) behave normally.
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="/"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target) return;
  e.preventDefault();
  navigate(a.getAttribute('href'));
});

// Load the next page's data while the current page stays on screen, then swap
// everything at once; tearing down first caused a visible layout shift.
let routeSeq = 0;
async function route() {
  const seq = ++routeSeq;
  const r = currentPath();
  let data = null, loadErr = null;
  try {
    if (r.startsWith('/lesson/')) data = await api('/api/lesson/' + enc(r.slice(8)));
    else if (r.startsWith('/exercise/')) data = await api('/api/exercise/' + enc(r.slice(10)));
  } catch (e) { loadErr = e; }
  if (seq !== routeSeq) return; // a newer navigation won

  document.body.classList.remove('drawer-open');
  applySidebar();
  closeExercise();
  document.body.classList.remove('ws-mode');
  $('hdr-left-extra').innerHTML = ''; $('hdr-center').innerHTML = '';
  $view.className = 'content'; $view.removeAttribute('style');
  renderShell();
  try {
    if (loadErr) throw loadErr;
    let title = '';
    if (r.startsWith('/lesson/')) {
      viewLesson(r.slice(8), data);
      const l = course.flatMap(m => m.lessons).find(l => l.id === r.slice(8));
      title = l ? l.short || l.title : '';
    } else if (r.startsWith('/exercise/')) {
      await viewExercise(r.slice(10), data);
      title = cur ? `${cur.ex.index}. ${cur.ex.title}` : '';
    } else if (r === '/settings') { viewSettings(); title = 'Settings'; }
    else viewHome();
    document.title = title ? `${title} · Learn Go` : 'Learn Go';
    $main.scrollTop = 0;
    $side.querySelector('.nav-item.active')?.scrollIntoView({ block: 'nearest' });
  } catch (e) {
    $view.className = 'content';
    $view.innerHTML = `<div class="empty"><span class="big">${icon('alert')}</span><h3>Something went wrong</h3><p class="mono">${esc(e.message)}</p><a class="btn" href="/">Go home</a></div>`;
  }
}
document.addEventListener('keydown', e => {
  if (document.querySelector('.modal-scrim')) return;
  if (!(e.ctrlKey || e.metaKey)) { if (e.key === 'Escape') document.body.classList.remove('drawer-open'); return; }
  if (e.key === 'Enter' && cur) { e.preventDefault(); runTests(); }
  if ((e.key === 's' || e.key === 'S') && cur) { e.preventDefault(); formatNow(); }
});
window.addEventListener('popstate', route);
loadCourse().then(route).catch(e => { $view.innerHTML = `<div class="empty"><span class="big">${icon('alert')}</span><h3>Could not reach the platform server</h3><p>${esc(e.message)}</p></div>`; });
</script>
</body>
</html>
